<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇦🇺 2026 澳洲家庭行程</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f7f5f0;color:#222;height:100vh;display:flex;flex-direction:column}
header{position:relative;background:linear-gradient(135deg,#1a365d 0%,#2d5a87 100%);color:#fff;padding:16px 14px 12px}
header h1{font-size:18px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
header p{font-size:12px;opacity:.85;margin-top:3px}
.home{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:14px;font-size:11px;text-decoration:none;font-weight:600;border:1px solid rgba(255,255,255,.4)}
.cities{display:flex;gap:8px;padding:8px 12px;background:#12293f}
.cities button{flex:1;padding:8px;border:none;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:600}
.cities button.on{background:#d4a843;color:#1a365d}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid #e5e5e5;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:6px 12px;border:1px solid #d8d3c8;background:#fff;border-radius:16px;font-size:12px;color:#444}
.tabs button.on{background:#1a365d;color:#fff;border-color:#1a365d}
.layout{flex:1;display:flex;flex-direction:column;min-height:0}
#map{flex:1;min-height:200px}
.sidebar{overflow-y:auto;padding:10px;background:#fff}
.item{display:flex;gap:9px;padding:8px 6px;border-bottom:1px solid #f0eee9}
.num{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tt{font-size:13px;font-weight:600}
.tt span{font-weight:400;color:#888;font-size:11px;margin-left:5px}
.dd{font-size:11.5px;color:#666;margin-top:2px;line-height:1.45}
.note{background:#fff8e6;border-left:3px solid #d4a843;padding:8px 10px;font-size:11.5px;color:#6b5a2a;margin:8px 6px;border-radius:4px;line-height:1.5}
.marker{width:32px;height:32px;border-radius:50%;color:#333;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);border:2px solid #fff}
.location-label .label-content{font-size:11px;font-weight:600;color:#1a365d;background:rgba(255,255,255,.9);border-radius:4px;padding:1px 4px;text-align:center;white-space:nowrap;display:inline-block}
@media(min-width:680px){.layout{flex-direction:row}#map{order:1;flex:1}.sidebar{order:2;width:340px}}
@media(max-width:679px){.sidebar{order:1;max-height:42vh}#map{order:2}}
</style>
</head>
<body>
<header>
<h1>🇦🇺 2026 澳洲家庭行程</h1>
<p>9/26 – 10/5 · 悉尼 + 布里斯班 · ZQ / Amy / 孔雀 / 玥玥</p>
<a class="home" href="index.html">🗺️ 行程</a>
</header>
<div class="cities">
<button id="c-syd" class="on" onclick="selCity('syd')">🌉 悉尼 9/26–9/30</button>
<button id="c-bne" onclick="selCity('bne')">🐨 布里斯班 9/30–10/4</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const DAYC=['#e11d48','#16a34a','#2563eb','#d97706','#7c3aed','#0891b2'];

const DATA={
 syd:{center:[-33.860,151.210],zoom:13,
  days:[
   {t:'总览',spots:[
     {n:'悉尼机场 SYD',e:'✈️',ty:'transport',la:-33.9399,lo:151.1753,d:'9/26 19:25 落地（OZ601）'},
     {n:'悉尼香格里拉酒店 Shangri-La Sydney',e:'🏨',ty:'hotel',la:-33.8591,lo:151.2088,d:'已定住宿 · The Rocks 岩石区，176 Cumberland St；步行可达环形码头'},

     {n:'达令港 Darling Harbour',e:'🎡',ty:'attraction',la:-33.8737,lo:151.1998,d:'SEA LIFE 水族馆 + Darling Quarter 儿童游乐场'},
     {n:'岩石区 The Rocks',e:'🏘️',ty:'attraction',la:-33.8586,lo:151.2098,d:'酒店门口的历史街区，可看海港大桥'}
   ]},
   {t:'9/26 抵达',spots:[
     {n:'悉尼机场 SYD',e:'✈️',ty:'transport',la:-33.9399,lo:151.1753,d:'19:25 落地（OZ601）；建议直接打车/预约接机至酒店，避免带娃拖行李换乘'},
     {n:'悉尼香格里拉酒店 Shangri-La Sydney',e:'🏨',ty:'hotel',la:-33.8591,lo:151.2088,d:'入住、休整；晚餐以酒店或 The Rocks 附近简餐为主'}
   ]},
   {t:'9/27 海港+ZOOOM',spots:[
     {n:'悉尼香格里拉酒店 Shangri-La Sydney',e:'🏨',ty:'hotel',la:-33.8591,lo:151.2088,d:'上午从酒店步行出发，路线平缓、便于 Amy 控制脚踝负荷'},
     {n:'岩石区 The Rocks',e:'🏘️',ty:'attraction',la:-33.8586,lo:151.2098,d:'上午慢逛历史街区、看海港大桥；按孩子节奏随时休息'},
     {n:'环形码头 Circular Quay',e:'⛴️',ty:'transport',la:-33.8611,lo:151.2134,d:'午餐后沿港湾步行至歌剧院；也是次日去塔龙加的渡轮出发点'},
     {n:'悉尼歌剧院 Sydney Opera House',e:'🎭',ty:'kids',la:-33.8568,lo:151.2153,d:'建议订 ZOOOM 13:00 场（约 40 分钟）；演后可参加艺术家交流；注意现场可能有频闪'}
   ]},
   {t:'9/28 塔龙加动物园',spots:[
     {n:'悉尼香格里拉酒店 Shangri-La Sydney',e:'🏨',ty:'hotel',la:-33.8591,lo:151.2088,d:'早餐后步行约 10 分钟至环形码头'},
     {n:'环形码头 Circular Quay',e:'⛴️',ty:'transport',la:-33.8611,lo:151.2134,d:'乘公共渡轮前往 Taronga Zoo Wharf；以当天时刻表为准'},
     {n:'塔龙加动物园 Taronga Zoo',e:'🦘',ty:'kids',la:-33.8434,lo:151.2413,d:'完整一天：优先澳洲动物、海豹/企鹅与儿童假期活动；Sky Safari 施工停运，改园内步行和接驳安排'},
     {n:'环形码头 Circular Quay',e:'🌇',ty:'attraction',la:-33.8611,lo:151.2134,d:'傍晚渡轮返航看港湾日落，回酒店休息'}
   ]},
   {t:'9/29 达令港',spots:[
     {n:'悉尼香格里拉酒店 Shangri-La Sydney',e:'🏨',ty:'hotel',la:-33.8591,lo:151.2088,d:'上午从酒店出发，打车约 10 分钟或步行结合轻轨前往达令港'},
     {n:'SEA LIFE Sydney Aquarium',e:'🐠',ty:'kids',la:-33.8696,lo:151.2016,d:'上午主活动：儒艮、鲨鱼与企鹅展区；春假建议预订首场入馆'},
     {n:'Darling Quarter 儿童游乐场',e:'🛝',ty:'kids',la:-33.8731,lo:151.2010,d:'午餐后放电；若天气热可缩短，留足回酒店休息时间'},
     {n:'Barangaroo Reserve 巴兰加鲁保护区',e:'🌿',ty:'attraction',la:-33.8627,lo:151.2019,d:'体力允许再去：海港边轻松散步；不作为硬性打卡'}
   ]},
   {t:'9/30 转场',spots:[
     {n:'悉尼香格里拉酒店 Shangri-La Sydney',e:'🏨',ty:'hotel',la:-33.8591,lo:151.2088,d:'退房；悉尼→布里斯班航班待订，建议预留充足机场时间'},
     {n:'悉尼机场 SYD',e:'✈️',ty:'transport',la:-33.9399,lo:151.1753,d:'飞往布里斯班；抵达后前往 W Brisbane 办理入住'}
   ]}
  ],
  notes:['✅ 悉尼三天按「一日一个核心体验 + 就近轻松活动」安排：海港艺术节 / 动物园 / 水族馆与游乐场。','⚠️ 9/28–10/9 是 NSW 春假；ZOOOM、SEA LIFE 和塔龙加门票建议先订。','⚠️ 塔龙加 Sky Safari 正在升级施工，预计 2027 年底重开；不按缆车安排动线。','🍽️ 点餐前核对：孔雀避核桃、桃子和山药；玥玥避开心果、腰果和山药。']
 },
 bne:{center:[-27.475,152.995],zoom:12,
  days:[
   {t:'总览',spots:[
     {n:'布里斯班机场 BNE',e:'✈️',ty:'transport',la:-27.3842,lo:153.1175,d:'9/30 抵达 · 10/5 CX156 飞香港'},
     {n:'W Brisbane 布里斯班 W 酒店',e:'🏨',ty:'hotel',la:-27.4678,lo:153.0181,d:'已定住宿 · 81 North Quay，CBD 河岸；到 South Bank 约 10 分钟车程'},
     {n:'南岸公园 South Bank',e:'🌴',ty:'attraction',la:-27.4785,lo:153.0230,d:'人工沙滩泳池、摩天轮、Brisbane 字母牌'},
     {n:'QAGOMA 昆士兰美术馆',e:'🎨',ty:'kids',la:-27.4712,lo:153.0170,d:'儿童创意中心免费，室内避晒'},
     {n:'Lone Pine 考拉保护区',e:'🐨',ty:'kids',la:-27.5333,lo:152.9690,d:'市区西南 12km；2024/7 起已取消抱考拉，只能贴身合影'},
     {n:"Bluey's World",e:'🐶',ty:'kids',la:-27.4300,lo:153.0730,d:'Hamilton Northshore，沉浸式剧场，必须官网提前订场次票'},
     {n:'摩顿岛 Tangalooma（备选）',e:'🐬',ty:'attraction',la:-27.1800,lo:153.3700,d:'渡轮单程 75–90 分钟，需整整一天'}
   ]},
   {t:'10/1 南岸+美术馆',spots:[
     {n:'南岸公园 South Bank',e:'🌴',ty:'attraction',la:-27.4785,lo:153.0230,d:'上午：草坪、Streets Beach、Brisbane 字母牌、摩天轮'},
     {n:'河岸午餐',e:'🍽️',ty:'food',la:-27.4760,lo:153.0205,d:'中午在 South Bank 河边餐厅吃饭'},
     {n:'QAGOMA 昆士兰美术馆',e:'🎨',ty:'kids',la:-27.4712,lo:153.0170,d:'下午：儿童创意中心，室内避午后暴晒；离南岸步行 5 分钟'}
   ]},
   {t:'10/2 考拉园',spots:[
     {n:'Lone Pine 考拉保护区',e:'🐨',ty:'kids',la:-27.5333,lo:152.9690,d:'整天。Cultural Centre 有直达大巴，也可坐船前往；袋鼠可投喂'}
   ]},
   {t:"10/3 Bluey's World",spots:[
     {n:"Bluey's World",e:'🐶',ty:'kids',la:-27.4300,lo:153.0730,d:'离市区约 20 分钟车程；沉浸式体验约 1.5 小时，需选场次'},
     {n:'Northshore Hamilton 河岸',e:'🍦',ty:'food',la:-27.4340,lo:153.0700,d:'结束后河边餐饮区吃饭'}
   ]},
   {t:'备选 摩顿岛',spots:[
     {n:'Holt Street Wharf 渡轮码头',e:'⛴️',ty:'transport',la:-27.4180,lo:153.1010,d:'Tangalooma 渡轮出发点'},
     {n:'Tangalooma 度假村',e:'🐬',ty:'attraction',la:-27.1800,lo:153.3700,d:'喂野生海豚、沙丘滑沙、沉船浮潜'}
   ]},
   {t:'10/4 自由活动',spots:[
     {n:'W Brisbane 布里斯班 W 酒店',e:'🏨',ty:'hotel',la:-27.4678,lo:153.0181,d:'不赶行程：酒店泳池/河岸散步，作为天气或体力的弹性日'}
   ]},
   {t:'10/5 返程',spots:[
     {n:'布里斯班机场 BNE',e:'✈️',ty:'transport',la:-27.3842,lo:153.1175,d:'CX156 飞香港 → CX390 回北京；从 W Brisbane 出发，预留国际航班值机时间'}
   ]}
  ],
  notes:['⚠️ 9/19–10/4 是昆州春假高峰，Bluey\'s World 和 Lone Pine 都要提前订票，Bluey 最先订。','⚠️ 摩顿岛一去就是整天，目前只有转场日/回程日有空，大概率放弃；除非砍掉一项。','💡 抱考拉需去黄金海岸 Currumbin / Paradise Country，但已定不去黄金海岸。']
 }
};

let city='syd',day=0,map,layer;
map=L.map('map').setView(DATA.syd.center,DATA.syd.zoom);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
layer=L.layerGroup().addTo(map);

function selCity(c){city=c;day=0;
 document.getElementById('c-syd').className=c==='syd'?'on':'';
 document.getElementById('c-bne').className=c==='bne'?'on':'';
 renderTabs();render();}

function renderTabs(){
 document.getElementById('tabs').innerHTML=DATA[city].days.map((d,i)=>
  `<button class="${i===day?'on':''}" onclick="selDay(${i})">${d.t}</button>`).join('');
}
function selDay(i){day=i;renderTabs();render();}

function render(){
 const cfg=DATA[city],dd=cfg.days[day],sp=dd.spots,col=DAYC[day%DAYC.length];
 layer.clearLayers();
 let html='';
 if(!sp.length){html='<div class="note">这一天还没排内容 —— 想去什么直接告诉我，我加进来。</div>';}
 sp.forEach((s,i)=>{
  html+=`<div class="item"><div class="num" style="background:${col}">${i+1}</div><div><div class="tt">${s.e} ${s.n}</div><div class="dd">${s.d}</div></div></div>`;
  L.marker([s.la,s.lo],{icon:L.divIcon({className:'',html:`<div class="marker" style="background:${COLORS[s.ty]}">${s.e}</div>`,iconSize:[32,32],iconAnchor:[16,16]})})
   .bindPopup(`<b>${s.e} ${s.n}</b><br>${s.d}`).addTo(layer);
  L.marker([s.la,s.lo],{icon:L.divIcon({className:'location-label',html:`<div class="label-content">${i+1} ${s.n}</div>`,iconSize:[150,20],iconAnchor:[75,-18]})}).addTo(layer);
 });
 if(sp.length>1){L.polyline(sp.map(s=>[s.la,s.lo]),{color:col,weight:2,dashArray:'5,6',opacity:.7}).addTo(layer);}
 if(day===0){html+=cfg.notes.map(n=>`<div class="note">${n}</div>`).join('');}
 document.getElementById('sidebar').innerHTML=html;
 if(sp.length){const b=L.latLngBounds(sp.map(s=>[s.la,s.lo]));map.fitBounds(b,{padding:[30,30],paddingTopLeft:[30,80],paddingBottomRight:[30,30],maxZoom:14});}
 else{map.setView(cfg.center,cfg.zoom);}
}
window.onload=()=>{renderTabs();setTimeout(()=>{map.invalidateSize();render();},200);};
</script>
<script data-goatcounter="https://ibread.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
