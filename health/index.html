<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Health</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#0f1115;color:#e7e9ee;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding:18px}
 .wrap{max-width:1180px;margin:0 auto}
 h1{font-size:19px;margin:0 0 4px}.sub{color:#8b93a5;font-size:13px;margin-bottom:16px}
 #gate{max-width:340px;margin:16vh auto;text-align:center}
 #gate h2{font-size:17px;font-weight:600;margin:0 0 4px}
 #gate p{color:#8b93a5;font-size:13px;margin:0 0 18px}
 #pw{width:100%;padding:13px 15px;font-size:17px;background:#171a21;border:1px solid #2a2f3d;border-radius:10px;color:#e7e9ee;text-align:center;letter-spacing:.3em}
 #pw:focus{outline:none;border-color:#4c6ef5}
 #go{width:100%;margin-top:10px;padding:12px;font-size:15px;background:#4c6ef5;border:0;border-radius:10px;color:#fff;font-weight:600;cursor:pointer}
 #go:disabled{opacity:.5;cursor:default}
 #err{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:10px}
 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
 .k{background:#171a21;border:1px solid #232734;border-radius:10px;padding:11px 13px}
 .k .l{color:#8b93a5;font-size:12px}.k .v{font-size:21px;font-weight:600;margin-top:3px}
 .k .n{color:#6f7789;font-size:11px;margin-top:2px}
 .c{background:#171a21;border:1px solid #232734;border-radius:10px;padding:13px;margin-bottom:14px}
 .c h2{font-size:14px;margin:0 0 4px;color:#c8cedb;font-weight:600}
 .c .hint{color:#6f7789;font-size:12px;margin:0 0 10px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 @media(max-width:820px){.grid2{grid-template-columns:1fr}}
 .secthead{margin:26px 0 12px;padding:11px 14px;border-radius:9px;border:1px solid #23283a}
 .secthead.sec1{background:linear-gradient(90deg,#1a2230,#12151c);border-left:4px solid #4dabf7}
 .secthead.sec2{background:linear-gradient(90deg,#1f1c2b,#12151c);border-left:4px solid #9775fa}
 .sectag{font-size:11px;letter-spacing:1.5px;color:#6c757d;margin-bottom:3px}
 .secttl{font-size:15.5px;font-weight:600;color:#f1f3f5}
 .secsub{font-size:12.5px;color:#868e96;line-height:1.6;margin-top:4px}
 .bad-legend{color:#ff8787}
 .kicon{font-size:15px;margin-right:5px}
 .k{border-left:3px solid #2a2f3d}
 .k.st-good{border-left-color:#40c057}
 .k.st-warn{border-left-color:#fab005}
 .k.st-bad{border-left-color:#ff6b6b}
 .k .l{display:flex;align-items:center}
 .rangebar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
 .rangebar button{background:#171a21;border:1px solid #2a2f3d;color:#c8cedb;border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer}
 .rangebar button.on{background:#4c6ef5;border-color:#4c6ef5;color:#fff}
 table{width:100%;border-collapse:collapse;font-size:13px}
 .ins h3{font-size:13px;margin:14px 0 6px;color:#adb5bd;font-weight:600}
 .instabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
 .instabs button{background:#161a22;border:1px solid #2a2f3d;color:#adb5bd;border-radius:8px;padding:5px 13px;font-size:13px;cursor:pointer}
 .instabs button.on{background:#1971c2;border-color:#1971c2;color:#fff}
 .insspan{font-size:12px;color:#6c757d;margin-bottom:8px}
 .verdict{font-size:15px;line-height:1.55;background:#161a22;border-left:3px solid #4c6ef5;border-radius:6px;padding:10px 13px}
 .ins ul{list-style:none;padding:0;margin:0}
 .ins ul li{display:flex;gap:7px;font-size:13.5px;line-height:1.6;padding:3px 0;color:#dee2e6}
 .ins ul li b{flex:0 0 auto}
 .ins ol.todo{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7;color:#dee2e6}
 .cats{display:grid;gap:10px;margin-top:12px}
 @media(min-width:820px){.cats{grid-template-columns:repeat(3,1fr)}}
 .cat{background:#12151c;border:1px solid #23283a;border-left:3px solid #495057;border-radius:8px;padding:11px 13px}
 .cat.good{border-left-color:#40c057}
 .cat.mixed{border-left-color:#fab005}
 .cat.bad{border-left-color:#ff6b6b}
 .cath{font-size:14px;font-weight:600;color:#f1f3f5;margin-bottom:4px}
 .cath .mkw{float:right;font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600}
 .cat.good .mkw{background:rgba(64,192,87,.15);color:#69db7c}
 .cat.mixed .mkw{background:rgba(250,176,5,.15);color:#ffd43b}
 .cat.bad .mkw{background:rgba(255,107,107,.15);color:#ff8787}
 .catlegend{font-size:12px;color:#868e96;margin:0 0 12px;display:flex;gap:15px;flex-wrap:wrap}
 .catlegend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
 .catlegend b{display:inline-block;width:9px;height:9px;border-radius:2px}
 .ci.minor{color:#868e96}
 .verdict.tone-good{border-left:4px solid #40c057}
 .verdict.tone-mixed{border-left:4px solid #fab005}
 .verdict.tone-bad{border-left:4px solid #ff6b6b} .cath .mk{float:right}
 .catsum{font-size:12.5px;color:#868e96;margin-bottom:8px;line-height:1.5}
 .ci{display:flex;gap:6px;font-size:13px;line-height:1.6;padding:2px 0;color:#dee2e6}
 .ci b{flex:0 0 auto}
 .sports{display:grid;gap:10px}
 @media(min-width:820px){.sports{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}}
 .sp{background:#12151c;border:1px solid #23283a;border-left:3px solid #495057;border-radius:8px;padding:11px 13px}
 .sp.good{border-left-color:#40c057}
 .sp.bad{border-left-color:#ff6b6b}
 .sp.watch{border-left-color:#fab005}
 .sph{font-size:14px;font-weight:600;color:#f1f3f5}
 .sph .mk{float:right}
 .spsum{font-size:12px;color:#868e96;margin:3px 0 7px}
 .spt{width:100%;font-size:12.5px}
 .spt td{padding:2px 0;border:0}
 .spt td:first-child{color:#868e96}
 .spt td:last-child{text-align:right;color:#dee2e6}
 .spt i{font-style:normal;font-size:11.5px}
 .spt i.up{color:#40c057}
 .spt i.down{color:#ff8787}
 .spt i.flat{color:#868e96}
 .spi{margin-top:7px;font-size:12.5px;line-height:1.5;color:#c9d1d9;background:#161a22;border-radius:5px;padding:6px 8px}
 .spwin{font-size:12px;color:#868e96;margin-bottom:9px}
 .sptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
 .sptabs button{background:#12151c;border:1px solid #23283a;color:#868e96;border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer;font-family:inherit}
 .sptabs button b{color:#495057;font-weight:600}
 .sptabs button.on{background:#1c2333;border-color:#4dabf7;color:#f1f3f5}
 .sptabs button.on b{color:#4dabf7}
 .spgrid{display:grid;gap:12px}
 @media(min-width:820px){.spgrid{grid-template-columns:minmax(200px,1fr) 1.4fr}}
 .sphist{overflow-x:auto;max-height:230px;overflow-y:auto}
 .spt2{width:100%;border-collapse:collapse;font-size:12.5px}
 .spt2 th{position:sticky;top:0;background:#12151c;color:#868e96;font-weight:500;text-align:right;padding:4px 6px;border-bottom:1px solid #23283a}
 .spt2 th:first-child{text-align:left}
 .spt2 td{text-align:right;padding:3px 6px;border-bottom:1px solid #1a1e28;color:#dee2e6}
 .spt2 td:first-child{text-align:left;color:#868e96}
 .sphint{margin-top:7px;font-size:11.5px;color:#6c757d}
 tr.rowbad td:first-child{color:#ff8787;font-weight:600}
 .spl{margin-top:6px;font-size:11.5px;color:#6c757d;line-height:1.5}
 .pill{display:inline-block;background:#3a2226;color:#ff9b9b;border:1px solid #5c2f35;border-radius:10px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12px;white-space:nowrap}
 th,td{padding:6px 8px;text-align:right;border-bottom:1px solid #232734;white-space:nowrap}
 th:first-child,td:first-child{text-align:left}
 th{color:#8b93a5;font-weight:500}
 .scroll{overflow-x:auto}
 .cv{position:relative}
 .cv canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
 .foot{color:#5b6273;font-size:12px;text-align:center;margin:22px 0 6px}
</style></head><body>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.iv)}, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err');
async function tryUnlock(){
  err.textContent=''; go.disabled=true; go.textContent='解锁中…';
  try{
    const data = await unlock(pw.value.trim());
    sessionStorage.setItem('hp', pw.value.trim());
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    render(data);
  }catch(e){
    err.textContent='密码不对'; pw.value=''; pw.focus();
  }finally{ go.disabled=false; go.textContent='解锁'; }
}
go.onclick=tryUnlock;
pw.onkeydown=e=>{ if(e.key==='Enter') tryUnlock(); };
window.addEventListener('DOMContentLoaded',()=>{
  const saved=sessionStorage.getItem('hp');
  if(saved){ pw.value=saved; tryUnlock(); } else pw.focus();
});

const WD=['日','一','二','三','四','五','六'];
function wd(dstr){ const d=new Date(dstr+'T12:00:00'); return isNaN(d)?'':WD[d.getDay()]; }
function dlabel(dstr){ return dstr.slice(5)+' '+wd(dstr); }
function isWeekend(dstr){ const d=new Date(dstr+'T12:00:00'); return d.getDay()===0||d.getDay()===6; }
function paceS(p){ if(p==null) return '—'; const m=Math.floor(p), sec=Math.round((p%1)*60); return m+"'"+String(sec).padStart(2,'0')+'"'; }
function dlt(cur,prev,inv,unit,dig){
  if(cur==null||prev==null) return '';
  const d=cur-prev; if(Math.abs(d)<(dig?0.05:0.5)) return ' <i class=flat>持平</i>';
  const good=inv?d<0:d>0;
  return ' <i class='+(good?'up':'down')+'>'+(d>0?'↑':'↓')+(dig?Math.abs(d).toFixed(dig):Math.round(Math.abs(d)))+(unit||'')+'</i>';
}

function stressNote(R){
  const v=R.map(r=>r.highStressMin).filter(x=>x!=null);
  if(!v.length) return '无数据';
  const d=v.filter(x=>x>0).length;
  return d+'/'+v.length+' 天有高压';
}

function acwrOf(rows){
  const L=rows.map(r=>r.load||0);
  return L.map((_,i)=>{
    const a=L.slice(Math.max(0,i-6),i+1); const c=L.slice(Math.max(0,i-27),i+1);
    const ca=c.reduce((s,x)=>s+x,0)/c.length;
    return ca>0 ? (a.reduce((s,x)=>s+x,0)/7)/ca : null;
  });
}

function draw(){
  CHARTS.forEach(c=>c.destroy()); CHARTS=[];
  document.querySelectorAll('#rb button').forEach(b=>b.classList.toggle('on',+b.dataset.d===RANGE));
  const R=ALL.slice(-RANGE); const L=R.map(r=>RANGE<=14?dlabel(r.date):r.date.slice(5));
  const nn=k=>R.map(r=>r[k]).filter(v=>v!=null);
  const acwr=acwrOf(R);
  document.getElementById('sub').textContent=R[0].date+' ~ '+R[R.length-1].date+' · 共 '+R.length+' 天';

  const load7=R.slice(-7).reduce((s,r)=>s+(r.load||0),0);
  const avgSleep=avg(nn('sleepMin')), avgHrv=avg(nn('hrv')), avgRhr=avg(nn('rhr'));
  const avgBb=avg(nn('bodyBatteryWake')), avgHigh=avg(nn('highStressMin'));
  const lastAcwr=acwr[acwr.length-1];
  // 跟自己的基线比，不看绝对值：近 7 天 vs 更早的均值
  const trend=(k,lowerBetter)=>{
    const rec=R.slice(-7).map(r=>r[k]).filter(v=>v!=null);
    const base=R.slice(0,-7).map(r=>r[k]).filter(v=>v!=null);
    if(rec.length<2||base.length<3) return {st:'flat',d:null};
    const a=rec.reduce((x,y)=>x+y,0)/rec.length, b=base.reduce((x,y)=>x+y,0)/base.length;
    const d=a-b, pct=Math.abs(d)/b;
    if(pct<0.04) return {st:'good',d,flat:true};
    const better=lowerBetter?d<0:d>0;
    return {st:better?'good':(pct>0.09?'bad':'warn'),d};
  };
  const hrvT=trend('hrv',false), rhrT=trend('rhr',true);
  const trendNote=(t,unit,lowerBetter)=>{
    if(t.d==null) return '数据不足，无法对比';
    if(t.flat) return '跟基线持平 ✓';
    const up=t.d>0, good=lowerBetter?!up:up;
    return '近7天'+(up?'↑':'↓')+Math.abs(t.d).toFixed(1)+unit+(good?'，恢复转好':'，留意疲劳');
  };
  const actDays=R.filter(r=>(r.activities||[]).length).length;
  // st: good | warn | bad | flat  -> drives the colour bar on each KPI card
  const kp=[
    ['😴','平均睡眠',hm(avgSleep),'睡眠分均 '+f(avg(nn('sleepScore'))),
      avgSleep==null?'flat':avgSleep>=420?'good':avgSleep>=390?'warn':'bad'],
    ['❤️','平均 HRV',f(avgHrv)+' ms',trendNote(hrvT,'ms',false),
      hrvT.st],
    ['💓','静息心率',f(avgRhr)+' bpm',trendNote(rhrT,'bpm',true),
      rhrT.st],
    ['🔋','晨起电量',f(avgBb),'Body Battery',
      avgBb==null?'flat':avgBb>=75?'good':avgBb>=60?'warn':'bad'],
    ['😤','高压时长',f(avgHigh)+' 分/天',stressNote(R),
      avgHigh==null?'flat':avgHigh<10?'good':avgHigh<30?'warn':'bad'],
    ['🏋️','近7天负荷',f(load7),'ACWR '+(lastAcwr?lastAcwr.toFixed(2):'—'),
      lastAcwr==null?'flat':(lastAcwr>=0.8&&lastAcwr<=1.3)?'good':(lastAcwr>1.5||lastAcwr<0.6)?'bad':'warn'],
    ['🏃','有运动天数',actDays+'/'+R.length,'有睡眠记录 '+nn('sleepMin').length+' 天',
      R.length?(actDays/R.length>=0.5?'good':actDays/R.length>=0.3?'warn':'bad'):'flat'],
  ];
  document.getElementById('kpis').innerHTML=kp.map(k=>
    '<div class="k st-'+k[4]+'"><div class="l"><span class="kicon">'+k[0]+'</span>'+k[1]+'</div><div class="v">'+k[2]+'</div><div class="n">'+k[3]+'</div></div>').join('');

  // 基准线：深睡取本区间中位数（个人基线，不用通用值）
  const med=a=>{const b=[...a].sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:null;};
  const deepBase=med(nn('deepMin'))||0;
  const badNight=r=>(r.sleepMin!=null&&r.sleepMin<390)||(r.deepMin!=null&&deepBase&&r.deepMin<deepBase*0.7);
  const HIGH_D=r=>(r.highStressMin||0)>=30;
  Chart.defaults.color='#8b93a5'; Chart.defaults.borderColor='#232734';
  Chart.defaults.font.family='-apple-system,"PingFang SC",sans-serif';
  const o=x=>Object.assign({responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{boxWidth:11,font:{size:11}}}}},x||{});

  CHARTS.push(new Chart(document.getElementById('sleep'),{data:{labels:L,datasets:[
    {type:'bar',label:'深睡',data:R.map(r=>r.deepMin),backgroundColor:'#3b5bdb',stack:'s',yAxisID:'y'},
    {type:'bar',label:'REM',data:R.map(r=>r.remMin),backgroundColor:'#7048e8',stack:'s',yAxisID:'y'},
    {type:'bar',label:'浅睡',data:R.map(r=>r.lightMin),backgroundColor:'#4dabf7',stack:'s',yAxisID:'y'},
    {type:'bar',label:'清醒',data:R.map(r=>r.awakeMin),backgroundColor:'#e8590c',stack:'s',yAxisID:'y'},
    {type:'line',label:'睡眠分',data:R.map(r=>r.sleepScore),borderColor:'#ffd43b',tension:.3,pointRadius:2,yAxisID:'y1'},
    {type:'line',label:'7h 目标',data:R.map(()=>420),borderColor:'#868e96',borderDash:[6,4],borderWidth:1.2,pointRadius:0,yAxisID:'y'},
    {type:'line',label:'深睡基准 '+f(deepBase)+'分',data:R.map(()=>deepBase),borderColor:'#3b5bdb',borderDash:[3,3],borderWidth:1.2,pointRadius:0,yAxisID:'y'}]},
    options:o({scales:{y:{stacked:true,title:{display:true,text:'小时'},grid:{color:'#1c2029'},
        ticks:{callback:v=>(v/60).toFixed(0)+'h',stepSize:60}},
      x:{stacked:true,grid:{display:false},ticks:{color:R.map(r=>badNight(r)?'#ff8787':'#8b93a5')}},
      y1:{position:'right',min:40,max:100,grid:{display:false},title:{display:true,text:'分'}}},
      plugins:{legend:{labels:{boxWidth:11,font:{size:11}}},
        tooltip:{callbacks:{label:c=>c.dataset.yAxisID==='y1'
          ? c.dataset.label+': '+c.parsed.y
          : c.dataset.label+': '+Math.floor(c.parsed.y/60)+'h'+String(Math.round(c.parsed.y%60)).padStart(2,'0')}}}})}));

  CHARTS.push(new Chart(document.getElementById('rec'),{data:{labels:L,datasets:[
    {type:'line',label:'HRV (ms)',data:R.map(r=>r.hrv),borderColor:'#38d9a9',tension:.3,pointRadius:2,yAxisID:'y'},
    {type:'line',label:'静息心率 (bpm)',data:R.map(r=>r.rhr),borderColor:'#ff6b6b',tension:.3,pointRadius:2,yAxisID:'y'},
    {type:'line',label:'晨起电量',data:R.map(r=>r.bodyBatteryWake),borderColor:'#fab005',tension:.3,pointRadius:2,borderDash:[4,3],yAxisID:'y1'}]},
    options:o({scales:{y:{title:{display:true,text:'ms / bpm'},grid:{color:'#1c2029'}},
      y1:{position:'right',min:0,max:100,grid:{display:false},title:{display:true,text:'电量'}},
      x:{grid:{display:false}}}})}));

  CHARTS.push(new Chart(document.getElementById('load'),{data:{labels:L,datasets:[
    {type:'bar',label:'日负荷',data:R.map(r=>r.load||0),backgroundColor:'#4c6ef5',yAxisID:'y'},
    {type:'line',label:'ACWR',data:acwr,borderColor:'#ff922b',tension:.3,pointRadius:2,yAxisID:'y1'},
    {type:'line',label:'风险上限 1.3',data:acwr.map(()=>1.3),borderColor:'#868e96',borderDash:[5,4],pointRadius:0,yAxisID:'y1'}]},
    options:o({scales:{y:{title:{display:true,text:'RPE×min'},grid:{color:'#1c2029'}},
      y1:{position:'right',min:0,max:2.2,grid:{display:false},title:{display:true,text:'ACWR'}},
      x:{grid:{display:false}}}})}));

  CHARTS.push(new Chart(document.getElementById('steps'),{data:{labels:L,datasets:[
    {type:'bar',label:'步数',data:R.map(r=>r.steps||0),
      backgroundColor:R.map(r=>(r.steps||0)>=8000?'#40c057':(r.steps||0)>=5000?'#fab005':'#495057')},
    {type:'line',label:'8k 目标',data:R.map(()=>8000),borderColor:'#868e96',borderDash:[5,4],pointRadius:0}]},
    options:o({scales:{y:{grid:{color:'#1c2029'}},x:{grid:{display:false}}}})}));

  const sPct=(r,k)=>{
    const t=(r.restStressMin||0)+(r.lowStressMin||0)+(r.medStressMin||0)+(r.highStressMin||0);
    if(!t) return null;
    return Math.round((r[k]||0)/t*1000)/10;
  };
  CHARTS.push(new Chart(document.getElementById('stress'),{data:{labels:L,datasets:[
    {type:'bar',label:'平静 <25',data:R.map(r=>sPct(r,'restStressMin')),backgroundColor:'#1971c2',stack:'s',yAxisID:'y'},
    {type:'bar',label:'低压 25-50',data:R.map(r=>sPct(r,'lowStressMin')),backgroundColor:'#4dabf7',stack:'s',yAxisID:'y'},
    {type:'bar',label:'中压 50-75',data:R.map(r=>sPct(r,'medStressMin')),backgroundColor:'#fab005',stack:'s',yAxisID:'y'},
    {type:'bar',label:'高压 >75',data:R.map(r=>sPct(r,'highStressMin')),backgroundColor:'#ff6b6b',stack:'s',yAxisID:'y'},
    {type:'line',label:'当日峰值',data:R.map(r=>r.maxStress),borderColor:'#e9ecef',borderWidth:1.5,pointRadius:0,yAxisID:'y1'},
    {type:'line',label:'高压日 ≥30分',data:R.map(r=>HIGH_D(r)?104:null),showLine:false,
      pointStyle:'triangle',pointRadius:7,pointRotation:180,pointBackgroundColor:'#ff6b6b',pointBorderColor:'#ff6b6b',yAxisID:'y1'}]},
    options:o({scales:{
      y:{stacked:true,min:0,max:100,title:{display:true,text:'占比 %'},grid:{color:'#1c2029'},ticks:{callback:v=>v+'%'}},
      y1:{position:'right',min:0,max:112,title:{display:true,text:'峰值'},grid:{display:false},ticks:{callback:v=>v>100?'':v}},
      x:{stacked:true,grid:{display:false},ticks:{color:R.map(r=>HIGH_D(r)?'#ff8787':'#8b93a5')}}},
      plugins:{legend:{labels:{boxWidth:11,font:{size:11}}},
        tooltip:{callbacks:{label:c=>{
          if(c.dataset.yAxisID==='y1') return c.dataset.label+': '+c.parsed.y;
          const r=R[c.dataIndex];
          const key={0:'restStressMin',1:'lowStressMin',2:'medStressMin',3:'highStressMin'}[c.datasetIndex];
          return c.dataset.label+': '+c.parsed.y+'% ('+(r[key]||0)+' 分钟)';
        }}}}})}));

  const wr=R.filter(r=>(r.stressWindows||[]).length).slice(-14).reverse();
  document.getElementById('swin').innerHTML = wr.length
    ? '<table><thead><tr><th>日期</th><th>高压合计</th><th>峰值时段（时间/峰值）</th></tr></thead><tbody>'
      + wr.map(r=>'<tr><td>'+dlabel(r.date)+'</td><td>'+(r.highStressMin??0)+' 分钟</td><td>'
        + r.stressWindows.map(w=>'<span class="pill">'+w.at+' · '+w.peak+'</span>').join(' ')
        + '</td></tr>').join('') + '</tbody></table>'
    : '<p class="hint">近期无高压时段 ✅</p>';

  const t=[...R].reverse().slice(0,60);
  document.getElementById('tbl').innerHTML='<table><thead><tr>'+
    ['日期','睡眠','分','深','REM','清醒','HRV','RHR','电量','压力','步数','负荷','运动']
      .map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    t.map(r=>'<tr'+(badNight(r)?' class="rowbad"':'')+'>'+[dlabel(r.date),hm(r.sleepMin),r.sleepScore??'—',r.deepMin??'—',r.remMin??'—',
      r.awakeMin??'—',r.hrv??'—',r.rhr??'—',r.bodyBatteryWake??'—',r.avgStress??'—',
      (r.steps??0).toLocaleString(),r.load||'—',
      (r.activities||[]).map(a=>a.label+' '+a.min+'m').join('、')||'—']
      .map((v,i)=>'<td'+(i===12?' style="text-align:left"':'')+'>'+v+'</td>').join('')+'</tr>').join('')+
    '</tbody></table>';
}
</script>
<script data-goatcounter="https://ibread.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body></html>
